name: Build PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Tectonic
        uses: WtfJoke/setup-tectonic@v4.0.5
        with:
          tectonic-version: 0.17.0

      - name: Compile book
        run: make build

      - name: Upload PDF
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hands-on-agent-pdf
          path: output/pdf/hands-on-agent.pdf
